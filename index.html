    <!-- Theme before first paint (same "theme" key as the original site) + JS flag for motion guards. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var theme = "light";
        try {
          theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        root.classList.add(theme);
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0e0d");
      })();
    </script>
    <style>
      html { background: #f1efea; }
      html.dark { background: #0e0e0d; }
    </style>

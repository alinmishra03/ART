<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aishwarya Raj Tyagi — Full Stack Developer</title>
    <meta name="description" content="Aishwarya Raj Tyagi — Full Stack Developer with 5+ years of experience building scalable, production-ready web applications in React, Next.js, and Node.js." />
    <meta name="author" content="Aishwarya Raj Tyagi" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#f1efea" />

    <!-- Open Graph / Twitter. Cards are generated by scripts/og-images.mjs; project pages get their own at build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aishwarya Raj Tyagi" />
    <meta property="og:title" content="Aishwarya Raj Tyagi — Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer with 5+ years of experience building production-ready web applications in React, Next.js, and Node.js." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og/site.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aishwarya Raj Tyagi — Full Stack Developer" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aishwarya Raj Tyagi — Full Stack Developer" />
    <meta name="twitter:description" content="Full Stack Developer with 5+ years of experience building production-ready web applications in React, Next.js, and Node.js." />
    <meta name="twitter:image" content="%SITE_URL%/og/site.jpg" />
    <meta name="twitter:image:alt" content="Aishwarya Raj Tyagi — Full Stack Developer" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Aishwarya Raj Tyagi",
            "jobTitle": "Full Stack Developer",
            "url": "%SITE_URL%/",
            "email": "mailto:aishraj05@gmail.com",
            "sameAs": ["https://github.com/aishrt", "https://www.linkedin.com/in/aishwarya-raj-tyagi/"]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Aishwarya Raj Tyagi — Full Stack Developer",
            "publisher": { "@id": "%SITE_URL%/#person" }
          }
        ]
      }
    </script>

    <!-- Theme before first paint (same "theme" key as the original site) + JS flag for motion guards. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var theme = "light";
        try {
          theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        root.classList.add(theme);
        if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0e0d");
      })();
    </script>
    <style>
      html { background: #f1efea; }
      html.dark { background: #0e0e0d; }
      /* Preloader cover paints on the first frame; React animates it away. */
      #preloader { position: fixed; inset: 0; z-index: 90; background: #121211; color: #f1efea; }
      html.dark #preloader { background: #ecebe6; color: #0e0e0d; }
      #preloader[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { #preloader { display: none; } }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
  <body>
    <noscript>
      <p style="padding:2rem;font-family:system-ui">This portfolio needs JavaScript. You can reach Aishwarya Raj Tyagi at <a href="mailto:aishraj05@gmail.com">aishraj05@gmail.com</a>.</p>
    </noscript>
    <div id="preloader" aria-hidden="true"></div>
    <script>
      // Failsafe: never leave the cover up if the app fails to take it over.
      setTimeout(function () {
        if (!window.__introTaken) document.getElementById("preloader").hidden = true;
      }, 6000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
